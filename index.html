  <script>
    // Synchronous page-transition cover (must run before paint)
    (function() {
      if (sessionStorage.getItem('pageTransition')) {
        document.documentElement.style.background = '#FF4D1F';
        var s = document.createElement('style');
        s.id = '__pt_cover_style';
        s.textContent = '#__pt_cover{position:fixed;inset:0;background:#FF4D1F;z-index:99999;transform:translateY(0);transition:transform .6s cubic-bezier(.76,0,.24,1);pointer-events:none;display:flex;align-items:center;justify-content:center}#__pt_cover .__pt_logo{font-family:"Clash Display",sans-serif;font-weight:600;font-size:clamp(48px,8vw,120px);letter-spacing:-.03em;color:#0a0a0a;display:flex;align-items:center;gap:20px;opacity:0;transition:opacity .35s}#__pt_cover.__pt_show .__pt_logo{opacity:1}#__pt_cover .__pt_dot{width:18px;height:18px;background:#0a0a0a;border-radius:50%;animation:__pt_pulse 1s ease-in-out infinite}@keyframes __pt_pulse{0%,100%{opacity:1}50%{opacity:.3}}body.__pt-revealed #__pt_cover{transform:translateY(-100%)}';
        document.head.appendChild(s);
        document.addEventListener('DOMContentLoaded', function() {
          var d = document.createElement('div');
          d.id = '__pt_cover';
          d.innerHTML = '<div class="__pt_logo"><span class="__pt_dot"></span>Vision Glow</div>';
          document.body.appendChild(d);
          requestAnimationFrame(function() { d.classList.add('__pt_show'); });
          sessionStorage.removeItem('pageTransition');
          // wait for full load before revealing
          var revealed = false;
          var reveal = function() {
            if (revealed) return;
            revealed = true;
            setTimeout(function() {
              document.body.classList.add('__pt-revealed');
              setTimeout(function() { d.remove(); document.documentElement.style.background = ''; }, 750);
            }, 220);
          };
          if (document.readyState === 'complete') reveal();
          else window.addEventListener('load', reveal);
          // safety net
          setTimeout(reveal, 1800);
        });
      }
    })();
  </script>

  <style>
    /* Cursor */
    .cursor-dot, .cursor-ring {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9999;
      will-change: transform;
    }
    .cursor-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      mix-blend-mode: difference;
    }
    .cursor-ring {
      width: 36px;
      height: 36px;
      border: 1px solid var(--fg);
      border-radius: 50%;
      mix-blend-mode: difference;
      transition: width 0.35s var(--ease), height 0.35s var(--ease), border-color 0.3s, background 0.3s;
    }
    .cursor-ring.is-hover {
      width: 60px;
      height: 60px;
      background: var(--accent);
      border-color: var(--accent);
      margin-left: -12px;
      margin-top: -12px;
    }
    @media (hover: none) {
      .cursor-dot, .cursor-ring { display: none; }
    }
    body { cursor: none; }
    @media (hover: none) { body { cursor: auto; } }

    /* loading state */
    #__init_loader {
      position: fixed;
      inset: 0;
      z-index: 99998;
      background: #FF4D1F;
      color: #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      transition: transform 0.8s cubic-bezier(0.76, 0, 0.24, 1);
    }
    #__init_loader.__done { transform: translateY(-100%); }
    #__init_loader .__il_top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #__init_loader .__il_dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: #0a0a0a;
      border-radius: 50%;
      margin-right: 10px;
      vertical-align: middle;
      animation: __il_pulse 1s ease-in-out infinite;
    }
    @keyframes __il_pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    #__init_loader .__il_main {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    #__init_loader .__il_pct {
      font-family: 'Clash Display', sans-serif;
      font-weight: 600;
      font-size: clamp(80px, 18vw, 240px);
      line-height: 0.9;
      letter-spacing: -0.04em;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    #__init_loader .__il_pct span {
      font-size: 0.3em;
      font-weight: 500;
      padding-top: 0.5em;
      opacity: 0.7;
    }
    #__init_loader .__il_bar {
      height: 4px;
      background: rgba(10,10,10,0.2);
      position: relative;
      width: 100%;
    }
    #__init_loader .__il_bar_fill {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      transform: scaleX(0);
      transform-origin: left;
      will-change: transform;
    }
    @media (max-width: 600px) {
      #__init_loader { padding: 16px; }
      #__init_loader .__il_top { font-size: 10px; }
    }
  </style>

<body>
  <div id="__init_loader">
    <div class="__il_top">
      <span><span class="__il_dot"></span>VISION GLOW</span>
      <span>CHARGEMENT</span>
    </div>
    <div class="__il_main">
      <div class="__il_pct"><span id="__il_num">000</span><span>%</span></div>
      <div class="__il_bar"><div class="__il_bar_fill" id="__il_fill"></div></div>
    </div>
  </div>
  <script>
    (function() {
      var loader = document.getElementById('__init_loader');
      var num = document.getElementById('__il_num');
      var fill = document.getElementById('__il_fill');
      document.documentElement.style.overflow = 'hidden';
      var start = performance.now();
      var dur = 1800;
      var done = false;
      function step(t) {
        var p = Math.min(1, (t - start) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        num.textContent = String(Math.floor(eased * 100)).padStart(3, '0');
        fill.style.transform = 'scaleX(' + eased + ')';
        if (p < 1) requestAnimationFrame(step);
        else finish();
      }
      function finish() {
        if (done) return;
        done = true;
        setTimeout(function() {
          loader.classList.add('__done');
          document.documentElement.style.overflow = '';
          setTimeout(function() { loader.remove(); }, 850);
        }, 250);
      }
      requestAnimationFrame(step);
      setTimeout(finish, 3500);
    })();
  </script>
