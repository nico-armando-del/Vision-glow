  <script>
    (function() {
      if (sessionStorage.getItem('pageTransition')) {
        document.documentElement.style.background = '#FF4D1F';
        var s = document.createElement('style');
        s.id = '__pt_cover_style';
        s.textContent = '#__pt_cover{position:fixed;inset:0;background:#FF4D1F;z-index:99999;transform:translateY(0);transition:transform .6s cubic-bezier(.76,0,.24,1);pointer-events:none;display:flex;align-items:center;justify-content:center}#__pt_cover .__pt_logo{font-family:"Clash Display",sans-serif;font-weight:600;font-size:clamp(48px,8vw,120px);letter-spacing:-.03em;color:#0a0a0a;display:flex;align-items:center;gap:20px;opacity:0;transition:opacity .35s}#__pt_cover.__pt_show .__pt_logo{opacity:1}#__pt_cover .__pt_dot{width:18px;height:18px;background:#0a0a0a;border-radius:50%;animation:__pt_pulse 1s ease-in-out infinite}@keyframes __pt_pulse{0%,100%{opacity:1}50%{opacity:.3}}body.__pt-revealed #__pt_cover{transform:translateY(-100%)}';
        document.head.appendChild(s);
        document.addEventListener('DOMContentLoaded', function() {
          var d = document.createElement('div');
          d.id = '__pt_cover';
          d.innerHTML = '<div class="__pt_logo"><span class="__pt_dot"></span>Vision Glow</div>';
          document.body.appendChild(d);
          requestAnimationFrame(function() { d.classList.add('__pt_show'); });
          sessionStorage.removeItem('pageTransition');
          var revealed = false;
          var reveal = function() {
            if (revealed) return; revealed = true;
            setTimeout(function() {
              document.body.classList.add('__pt-revealed');
              setTimeout(function() { d.remove(); document.documentElement.style.background = ''; }, 750);
            }, 220);
          };
          if (document.readyState === 'complete') reveal();
          else window.addEventListener('load', reveal);
          setTimeout(reveal, 1800);
        });
      }
    })();
  </script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <style>
    body { cursor: none; }
    @media (hover: none) { body { cursor: auto; } }
    .cursor-dot, .cursor-ring {
      position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
      will-change: transform;
    }
    .cursor-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; mix-blend-mode: difference; }
    .cursor-ring {
      width: 36px; height: 36px; border: 1px solid var(--fg); border-radius: 50%;
      mix-blend-mode: difference;
      transition: width 0.35s var(--ease), height 0.35s var(--ease);
    }
    .cursor-ring.is-hover { width: 60px; height: 60px; background: var(--accent); border-color: var(--accent); margin-left: -12px; margin-top: -12px; }
    @media (hover: none) { .cursor-dot, .cursor-ring { display: none; } }

    /* Projects page chaos */
    .pp-hero {
      min-height: 90vh;
      padding: 140px 32px 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
    }
    .pp-hero-meta {
      position: absolute;
      top: 32px; left: 32px; right: 32px;
      display: flex; justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--fg-2);
      letter-spacing: 0.08em;
    }
    .pp-hero-meta a { color: var(--fg-2); }
    .pp-hero-meta a:hover { color: var(--accent); }
    .pp-hero h1 {
      font-family: 'Clash Display', sans-serif;
      font-weight: 500;
      font-size: clamp(64px, 11vw, 168px);
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin: 0;
    }
    .pp-hero h1 em {
      font-family: 'Clash Display', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    .pp-hero-sub {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      max-width: 1100px;
      margin-top: 60px;
      align-items: end;
    }
    .pp-hero-sub p {
      font-size: 18px;
      line-height: 1.5;
      color: var(--fg-2);
      max-width: 460px;
    }
    .pp-hero-count {
      font-family: 'Clash Display', sans-serif;
      font-size: clamp(56px, 8vw, 120px);
      font-weight: 500;
      line-height: 0.85;
      letter-spacing: -0.03em;
    }
    .pp-hero-count small {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--fg-2);
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 16px;
    }

    /* Filter strip */
    .pp-filter {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 20px 32px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(10,10,10,0.85);
      position: sticky;
      top: 72px;
      z-index: 40;
      backdrop-filter: blur(20px);
    }
    .pp-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 100px;
      color: var(--fg-2);
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.3s var(--ease);
    }
    .pp-chip:hover, .pp-chip.is-active { color: var(--fg); border-color: var(--fg); }
    .pp-chip.is-active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

    /* Chaos gallery */
    .pp-chaos {
      position: relative;
      padding: 160px 0;
      min-height: 200vh;
    }
    .pp-card {
      position: absolute;
      will-change: transform;
      cursor: pointer;
    }
    .pp-card-thumb {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      background: #0f0f0f;
    }
    .pp-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .pp-card-tag {
      position: absolute;
      top: 12px; left: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 4px 8px;
      background: rgba(10,10,10,0.65);
      color: #f5f1ea;
      border-radius: 100px;
      backdrop-filter: blur(8px);
    }
    .pp-card-label {
      position: absolute;
      bottom: -32px;
      left: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--fg-2);
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .pp-card-label .t { color: var(--fg); margin-right: 12px; }
    .pp-card:hover .pp-card-thumb { transform: scale(1.04); }
    .pp-card-thumb { transition: transform 0.6s var(--ease); }

    /* Footer */
    .pp-foot {
      padding: 120px 32px 60px;
      border-top: 1px solid var(--line);
      text-align: center;
    }
    .pp-foot h2 {
      font-family: 'Clash Display', sans-serif;
      font-size: clamp(48px, 8vw, 140px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.03em;
      margin-bottom: 40px;
    }
    .pp-foot h2 em {
      font-family: 'Clash Display', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    .pp-foot-meta {
      display: flex;
      justify-content: space-between;
      padding-top: 40px;
      border-top: 1px solid var(--line);
      margin-top: 80px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--fg-2);
      letter-spacing: 0.08em;
    }
    .pp-foot-legal {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding-top: 24px;
      margin-top: 24px;
      border-top: 1px solid var(--line);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-2);
    }
    .pp-foot-legal a {
      color: var(--fg-2);
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.3s var(--ease), border-color 0.3s var(--ease);
    }
    .pp-foot-legal a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .pp-foot-legal .sep { color: var(--fg-3); }
    .pp-back {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 28px;
      border: 1px solid var(--line);
      border-radius: 100px;
      color: var(--fg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: all 0.3s var(--ease);
    }
    .pp-back:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    /* Giant scrolling background text */
    .pp-bg-text {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      font-family: 'Clash Display', sans-serif;
      font-weight: 600;
      font-size: clamp(120px, 28vw, 440px);
      letter-spacing: -0.045em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(245,241,234,0.06);
      white-space: nowrap;
      pointer-events: none;
      z-index: 0;
      line-height: 0.85;
    }

    @media (max-width: 900px) {
      .pp-hero { padding: 100px 20px 40px; }
      .pp-hero-meta { left: 20px; right: 20px; top: 20px; }
      .pp-hero-sub { grid-template-columns: 1fr; gap: 32px; margin-top: 40px; }
      .pp-foot { padding: 80px 20px 40px; }
    }
  </style>
</head>
<body>
